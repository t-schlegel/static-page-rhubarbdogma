<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sternmagiekolonie - rhubarb dogma</title>
    <link rel="stylesheet" href="../../style.css" />
    <style>
      .gallery-grid {
        display: grid;
        grid-template-columns: repeat(2, 1fr);
        gap: 1rem;
        padding: 2rem;
        max-width: 1200px;
        margin: 0 auto;
      }
      
      @media (max-width: 768px) {
        .gallery-grid {
          grid-template-columns: repeat(2, 1fr);
          padding: 1rem;
        }
      }
      
      @media (max-width: 480px) {
        .gallery-grid {
          grid-template-columns: 1fr;
        }
      }
      
      .gallery-item {
        cursor: pointer;
        transition: transform 0.3s ease-out;
        border-radius: 8px;
        overflow: hidden;
      }
      
      .gallery-item:hover {
        transform: scale(1.05);
      }
      
      
      .gallery-item img {
        width: 100%;
        height: 400px;
        object-fit: cover;
        display: block;
      }
      
      .modal {
        display: none;
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background: rgba(0,0,0,0.6);
        z-index: 999;
        justify-content: center;
        align-items: center;
      }
      
      .modal.active {
        display: flex;
      }
      
      .modal-content {
        position: relative;
        display: flex;
        align-items: center;
        justify-content: center;
        max-width: 90%;
        gap: 2rem;
      }
      
      .modal-img {
        max-width: 80%;
        max-height: 90vh;
        object-fit: contain;
      }
      
      .nav-button {
        background: none;
        border: none;
        cursor: pointer;
        padding: 0;
      }
      
      .nav-button img {
        width: 100px;
        height: 100px;
        transition: all 0.3s ease;
      }
      
      .nav-button:hover img {
        transform: scale(1.05);
      }
      
      
      
      @media (max-width: 768px) {
        .modal-content {
          flex-direction: column;
          align-items: center;
        }
        
        .nav-button img {
          width: 60px;
          height: 60px;
        }
        
        .modal-img {
          max-width: 100%;
          max-height: calc(80vh - 120px);
        }
        
        .nav-button:first-child img {
          transform: rotate(90deg);
        }
        
        .nav-button:last-child img {
          transform: rotate(90deg);
        }
      }
      
      .main-content {
        margin-top: 80px;
        padding: 0 1rem;
      }
      
      .page-title {
        text-align: center;
        font-size: 4rem;
        margin-bottom: 2rem;
        font-family: 'Times New Roman', Times, serif;
      }
      
      @media (max-width: 768px) {
        .page-title {
          font-size: 2rem;
        }
      }
    </style>
  </head>
  <body>
    <header class="w-full fixed top-0 left-0 right-0" style="width: 100%; max-width: 100%">
      <div class="max-w-screen-2xl mx-auto relative">
        <a href="../../" class="font-times text-xl hover:underline fixed top-0 left-0 m-4 z-10">rhubarb dogma</a>
      </div>
    </header>

    <div class="main-content">
      <h1 class="page-title"><a href="https://www.youtube.com/@rhubarbdogma" class="hover:underline">Sternmagiekolonie</a></h1>
      
      <div class="gallery-grid gallery" id="gallery">
        <div class="gallery-item">
          <img src="smk1.png" alt="SMK 1" />
        </div>
        <div class="gallery-item">
          <img src="smk2.png" alt="SMK 2" />
        </div>
        <div class="gallery-item">
          <img src="smk3.png" alt="SMK 3" />
        </div>
        <div class="gallery-item">
          <img src="smk4.png" alt="SMK 4" />
        </div>
        <div class="gallery-item">
          <img src="smk7.png" alt="SMK 7" />
        </div>
        <div class="gallery-item">
          <img src="smk8.png" alt="SMK 8" />
        </div>
        <div class="gallery-item">
          <img src="smk9.png" alt="SMK 9" />
        </div>
        <div class="gallery-item">
          <img src="smk9.5.png" alt="SMK 9.5" />
        </div>
        <div class="gallery-item">
          <img src="smk10.png" alt="SMK 10" />
        </div>
        <div class="gallery-item">
          <img src="smk11.png" alt="SMK 11" />
        </div>
        <div class="gallery-item">
          <img src="smk12.png" alt="SMK 12" />
        </div>
        <div class="gallery-item">
          <img src="smk13.png" alt="SMK 13" />
        </div>
        <div class="gallery-item">
          <img src="smk14.png" alt="SMK 14" />
        </div>
        <div class="gallery-item">
          <img src="smk15.png" alt="SMK 15" />
        </div>
        <div class="gallery-item">
          <img src="smk16.png" alt="SMK 16" />
        </div>
        <div class="gallery-item">
          <img src="smk17.png" alt="SMK 17" />
        </div>
        <div class="gallery-item">
          <img src="smk18.png" alt="SMK 18" />
        </div>
        <div class="gallery-item">
          <img src="smk19.png" alt="SMK 19" />
        </div>
        <div class="gallery-item">
          <img src="smk20.png" alt="SMK 20" />
        </div>
        <div class="gallery-item">
          <img src="smk21.png" alt="SMK 21" />
        </div>
        <div class="gallery-item">
          <img src="smk22.png" alt="SMK 22" />
        </div>
        <div class="gallery-item">
          <img src="smk23.png" alt="SMK 23" />
        </div>
        <div class="gallery-item">
          <img src="smk24.png" alt="SMK 24" />
        </div>
      </div>
    </div>

    <div class="modal" id="imageModal">
      <div class="modal-content">
        <button id="prev" class="nav-button">
          <img src="../../svg/prev.svg" width="100" height="100" class="nav-button transition brightness-100 transform transition-transform active:brightness-100">
        </button>
        <img id="modalImage" src="" alt="Modal Image" class="modal-img">
        <button id="next" class="nav-button">
          <img src="../../svg/next.svg" width="100" height="100" class="nav-button transition brightness-100 transform transition-transform active:brightness-100">
        </button>
      </div>
    </div>

    <script>
      const modal = document.getElementById('imageModal');
      const modalImg = document.getElementById('modalImage');
      const images = document.querySelectorAll('.gallery img');
      let currentImageIndex = 0;

      // Add click handlers to all gallery images
      images.forEach((img, index) => {
        img.addEventListener('click', () => {
          currentImageIndex = index;
          openModal(img.src);
        });
      });

      function openModal(src) {
        modal.classList.add('active');
        modalImg.src = src;
        document.body.style.overflow = 'hidden';
        updateModalLayout();
      }

      function closeModal() {
        modal.classList.remove('active');
        document.body.style.overflow = 'auto';
      }

      function showImage(index) {
        currentImageIndex = index;
        if (currentImageIndex >= images.length) currentImageIndex = 0;
        if (currentImageIndex < 0) currentImageIndex = images.length - 1;
        modalImg.src = images[currentImageIndex].src;
      }

      // Navigation buttons
      document.getElementById('prev').addEventListener('click', () => {
        showImage(currentImageIndex - 1);
      });

      document.getElementById('next').addEventListener('click', () => {
        showImage(currentImageIndex + 1);
      });

      // Close modal when clicking outside the content or on the image
      modal.addEventListener('click', (e) => {
        if (e.target === modal || e.target === modalImg) {
          closeModal();
        }
      });

      // Keyboard navigation
      document.addEventListener('keydown', (e) => {
        if (modal.classList.contains('active')) {
          if (e.key === 'ArrowLeft' || e.key === 'h' || e.key === 'k') {
            showImage(currentImageIndex - 1);
          } else if (e.key === 'ArrowRight' || e.key === 'l' || e.key === 'j') {
            showImage(currentImageIndex + 1);
          } else if (e.key === 'Escape') {
            closeModal();
          }
        }
      });

      // Function to adjust modal layout based on screen size
      function updateModalLayout() {
        const modalContent = document.querySelector('.modal-content');
        const prevButton = document.getElementById('prev');
        const nextButton = document.getElementById('next');
        const prevArrow = prevButton.querySelector('img');
        const nextArrow = nextButton.querySelector('img');

        if (window.innerWidth <= 768) {
          // Mobile layout
          modalContent.style.flexDirection = 'column';
          modalContent.style.alignItems = 'center';

          // Position prev button above image
          prevButton.style.order = '1';
          // Position image in the middle
          modalImg.style.order = '2';
          // Position next button below image
          nextButton.style.order = '3';

          // Rotate arrows to point up/down
          prevArrow.style.transform = 'rotate(90deg)';
          nextArrow.style.transform = 'rotate(90deg)';

          // Allow image to take full width
          modalImg.style.maxWidth = '100%';
          modalImg.style.maxHeight = 'calc(80vh - 120px)';
        } else {
          // Desktop layout
          modalContent.style.flexDirection = 'row';
          modalContent.style.alignItems = 'center';

          // Reset order
          prevButton.style.order = '';
          modalImg.style.order = '';
          nextButton.style.order = '';

          // Reset arrow rotation
          prevArrow.style.transform = '';
          nextArrow.style.transform = '';

          // Reset image size
          modalImg.style.maxWidth = '';
          modalImg.style.maxHeight = '';
        }
      }

      // Apply layout on initial load and window resize
      window.addEventListener('resize', updateModalLayout);
      updateModalLayout();
    </script>
  </body>
</html>
