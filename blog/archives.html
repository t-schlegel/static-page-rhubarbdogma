<!DOCTYPE HTML PUBLIC "-//W3C//DTD HTML 4.01 Transitional//EN"
  "http://www.w3.org/TR/html4/loose.dtd">
<html>
<head>
  <meta http-equiv="Content-Type" content="text/html; charset=iso-8859-1">
  <meta name="viewport" content="width=device-width">
  <title>archives :: rhubarb dogma</title>
  <style type="text/css">
    body {
      background-color: #d0d0d0;
      color: #111111;
      font-family: "Times New Roman", Times, serif;
      font-size: 14px;
      margin: 0;
      padding: 0;
    }

    a {
      color: #88ccff;
      text-decoration: underline;
    }

    a:visited {
      color: #cc88ff;
    }

    a:hover {
      color: #ffffff;
      background-color: #444444;
    }

    /* ---- LEFT COLUMN (title + nav) ---- */
    #left-col {
      width: 110px;
      padding: 14px 10px 0 14px;
      vertical-align: top;
    }

    #left-col h1 {
      font-family: "Times New Roman", Times, serif;
      font-size: 28px;
      color: #111111;
      margin: 0 0 12px 0;
      padding: 0;
    }

    #navbar a {
      display: block;
      background-color: #aa0000;
      color: #ffffff;
      font-size: 11px;
      font-weight: bold;
      border: 2px outset #ff8888;
      padding: 3px 8px;
      margin: 0 0 4px 0;
      font-family: "Times New Roman", Times, serif;
      text-decoration: none;
      letter-spacing: 0.5px;
    }

    #navbar a:visited {
      color: #ffffff;
    }

    #navbar a:hover {
      background-color: #cc0000;
      color: #ffffff;
      border-style: inset;
    }

    /* ---- OUTER WRAPPER ---- */
    #outer {
      margin: 14px 0 0 0;
    }

    /* ---- MAIN CONTENT AREA ---- */
    #main-content {
      background-color: #d0d0d0;
      padding: 0 8px;
      vertical-align: top;
    }

    /* ---- POST INDEX TABLE ---- */
    #post-index {
      width: 100%;
      border-collapse: separate;
      border-spacing: 2px;
      border: 3px outset #cccccc;
      background-color: #88ffff;
      color: #111111;
    }

    #post-index td {
      padding: 10px 12px;
      border: 2px inset #cccccc;
      vertical-align: middle;
      background-color: #88ffff;
    }

    #post-index tr:hover td {
      background-color: #66dddd;
    }

    .index-thumb {
      width: 80px;
      text-align: center;
      white-space: nowrap;
    }

    .index-thumb img {
      width: 72px;
      height: 54px;
      border: 1px solid #aaaaaa;
      display: block;
      margin: 0 auto;
      object-fit: cover;
    }

    .index-thumb .thumb-placeholder {
      width: 72px;
      height: 54px;
      background-color: #cccccc;
      border: 1px solid #aaaaaa;
      display: block;
      margin: 0 auto;
      font-size: 9px;
      color: #888888;
      text-align: center;
      line-height: 54px;
      font-family: "Times New Roman", Times, serif;
    }

    .index-info {
      padding-left: 6px;
    }

    .index-info a {
      font-family: "Times New Roman", Times, serif;
      font-size: 15px;
      font-weight: bold;
      color: #000088;
      text-decoration: underline;
    }

    .index-info a:visited {
      color: #440088;
    }

    .index-info a:hover {
      background-color: #ffffcc;
      color: #000000;
    }

    .index-desc {
      font-family: "Times New Roman", Times, serif;
      font-size: 13px;
      color: #444444;
      margin-top: 3px;
    }

    h2.section-header {
      font-family: "Times New Roman", Times, serif;
      font-size: 16px;
      color: #111111;
      border-bottom: 1px solid #888888;
      padding-bottom: 2px;
      margin: 0 0 10px 0;
      letter-spacing: 1px;
    }
  </style>
</head>
<body>

<!-- POST REGISTRY -->
<script type="text/javascript" src="posts.js"></script>

<!-- ==================== OUTER LAYOUT ==================== -->
<div id="outer">
  <table width="100%" cellpadding="0" cellspacing="10" border="0">
    <tr valign="top">

      <!-- ====== LEFT COLUMN: title + nav ====== -->
      <td id="left-col">
        <h1>rhubarb dogma</h1>
        <div id="navbar">
          <a href="index.html">[ home ]</a>
          <a href="about.html">[ about ]</a>
          <a href="archives.html">[ archives ]</a>
          <a href="links.html">[ links ]</a>
        </div>
      </td>

      <!-- ====== MAIN CONTENT ====== -->
      <td id="main-content">

        <h2 class="section-header">&#187; archives</h2>

        <table id="post-index" cellpadding="10" cellspacing="2">
        </table>

        <script type="text/javascript">
          var table = document.getElementById("post-index");
          var start = 10;
          if (POSTS.length <= 10) {
            var row = table.insertRow(-1);
            row.innerHTML =
              '<td colspan="2" style="text-align:center; padding:12px; color:#888888;">' +
                'No archived posts yet.' +
              '</td>';
          } else {
            for (var i = start; i < POSTS.length; i++) {
              var p = POSTS[i];
              var thumb = p.image
                ? '<img src="' + p.image + '" alt="">'
                : '<span class="thumb-placeholder">no img</span>';
              var row = table.insertRow(-1);
              row.innerHTML =
                '<td class="index-thumb">' + thumb + '</td>' +
                '<td class="index-info">' +
                  '<a href="' + p.link + '">' + p.title + '</a>' +
                  '<div class="index-desc">' + p.desc + '</div>' +
                '</td>';
            }
          }
        </script>

        <p style="margin-top:12px; font-size:13px;">
          &laquo; <a href="index.html">back to recent posts</a>
        </p>

      </td>
    </tr>
  </table>
</div><!-- end #outer -->

</body>
</html>
