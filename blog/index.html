<!DOCTYPE HTML PUBLIC "-//W3C//DTD HTML 4.01 Transitional//EN"
  "http://www.w3.org/TR/html4/loose.dtd">
<html>
<head>
  <meta http-equiv="Content-Type" content="text/html; charset=iso-8859-1">
  <meta name="viewport" content="width=device-width">
  <title>rhubarb dogma</title>
  <style type="text/css">
    body {
      background-color: #d0d0d0;
      color: #111111;
      font-family: "Times New Roman", Times, serif;
      font-size: 14px;
      margin: 0;
      padding: 0;
    }

    a {
      color: #88ccff;
      text-decoration: underline;
    }

    a:visited {
      color: #cc88ff;
    }

    a:hover {
      color: #ffffff;
      background-color: #444444;
    }

    /* ---- LEFT COLUMN (title + nav) ---- */
    #left-col {
      width: 110px;
      padding: 14px 10px 0 14px;
      vertical-align: top;
    }

    #left-col h1 {
      font-family: "Times New Roman", Times, serif;
      font-size: 28px;
      color: #111111;
      margin: 0 0 12px 0;
      padding: 0;
    }

    #navbar a {
      display: block;
      background-color: #aa0000;
      color: #ffffff;
      font-size: 11px;
      font-weight: bold;
      border: 2px outset #ff8888;
      padding: 3px 8px;
      margin: 0 0 4px 0;
      font-family: "Times New Roman", Times, serif;
      text-decoration: none;
      letter-spacing: 0.5px;
    }

    #navbar a:visited {
      color: #ffffff;
    }

    #navbar a:hover {
      background-color: #cc0000;
      color: #ffffff;
      border-style: inset;
    }

    /* ---- OUTER WRAPPER ---- */
    #outer {
      margin: 14px 0 0 0;
    }

    /* ---- MAIN CONTENT AREA ---- */
    #main-content {
      background-color: #d0d0d0;
      padding: 0 8px;
      vertical-align: top;
    }

    /* ---- SECTION HEADERS ---- */
    h2.section-header {
      font-family: "Times New Roman", Times, serif;
      font-size: 16px;
      color: #ffffff;
      border-bottom: 1px solid #555555;
      padding-bottom: 2px;
      margin: 0 0 10px 0;
      letter-spacing: 1px;
    }

    /* ---- BLOG ENTRIES ---- */
    .entry {
      border: 1px solid #3d3d3d;
      background-color: #252525;
      margin-bottom: 16px;
      padding: 10px 12px;
    }

    .entry-title {
      font-family: "Times New Roman", Times, serif;
      font-size: 15px;
      color: #ffffff;
      margin: 0 0 3px 0;
    }

    .entry-meta {
      font-size: 11px;
      color: #777777;
      margin-bottom: 8px;
      border-bottom: 1px dotted #3a3a3a;
      padding-bottom: 5px;
    }

    .entry-body {
      font-size: 13px;
      line-height: 1.6;
      color: #d0d0d0;
    }

    .entry-body p {
      margin: 0 0 8px 0;
    }

    .entry-footer {
      margin-top: 8px;
      font-size: 11px;
      color: #666666;
      border-top: 1px dotted #3a3a3a;
      padding-top: 5px;
    }

    /* ---- SIDEBAR WIDGETS ---- */
    .widget {
      margin-bottom: 14px;
    }

    .widget ul {
      margin: 0;
      padding: 0 0 0 14px;
      list-style-type: square;
    }

    .widget ul li {
      margin-bottom: 4px;
      font-size: 12px;
      color: #bbbbbb;
    }

    .widget p {
      font-size: 12px;
      color: #bbbbbb;
      margin: 0 0 5px 0;
      line-height: 1.5;
    }

    /* ---- COUNTER / BADGE AREA ---- */
    .counter-box {
      background-color: #111111;
      border: 1px inset #555555;
      color: #00ff41;
      font-family: "Times New Roman", Times, serif;
      font-size: 18px;
      letter-spacing: 4px;
      text-align: center;
      padding: 4px 6px;
      margin: 6px 0;
      font-weight: bold;
    }

    .badge {
      display: inline-block;
      background-color: #000088;
      color: #ffffff;
      font-size: 9px;
      font-weight: bold;
      border: 2px outset #aaaaff;
      padding: 2px 4px;
      margin: 2px 2px 2px 0;
      font-family: "Times New Roman", Times, serif;
      text-decoration: none;
      vertical-align: middle;
      letter-spacing: 0.5px;
    }

    .badge:visited {
      color: #ffffff;
    }

    .badge.green { background-color: #006600; border-color: #88ff88; }
    .badge.red { background-color: #880000; border-color: #ff8888; }
    .badge.purple { background-color: #440088; border-color: #cc88ff; }

    /* ---- MARQUEE ---- */
    .marquee-bar {
      background-color: #111111;
      border-top: 1px solid #444444;
      border-bottom: 1px solid #444444;
      padding: 3px 0;
      overflow: hidden;
      font-size: 11px;
      color: #aaaaaa;
    }

    /* ---- FOOTER ---- */
    #footer {
      border-top: 2px solid #555555;
      margin-top: 16px;
      padding: 10px 0;
      text-align: center;
      font-size: 11px;
      color: #666666;
    }

    #footer a {
      color: #777777;
    }

    /* ---- MISC ---- */
    .highlight { color: #ffffff; }
    .green-text { color: #88ff88; }
    .red-text { color: #ff8888; }
    .blink { text-decoration: blink; }

    hr {
      border: 0;
      border-top: 1px solid #444444;
      margin: 10px 0;
    }

    blockquote {
      border-left: 3px solid #555555;
      margin: 8px 0 8px 10px;
      padding: 4px 10px;
      color: #aaaaaa;
      font-style: italic;
    }

    .mood-bar {
      font-size: 11px;
      color: #888888;
      margin-bottom: 10px;
    }

    .tag {
      display: inline;
      background-color: #333333;
      border: 1px solid #555555;
      padding: 0 4px;
      font-size: 10px;
      color: #999999;
      margin-right: 3px;
    }

    /* ---- RIGHT SIDEBAR ---- */
    #right-col {
      width: 130px;
      padding: 0 14px 0 0;
      vertical-align: top;
    }

    #right-col h2.section-header {
      margin-top: 0;
    }

    /* ---- SIDEBAR MINI-POST TABLE ---- */
    .mini-post-table {
      width: 100%;
      border-collapse: collapse;
      border: 4px solid #777777;
      background-color: #ffffff;
      color: #111111;
    }

    .mini-post-table td {
      padding: 8px 10px;
      border-bottom: 1px solid #bbbbbb;
      vertical-align: top;
    }

    .mini-post-table tr:last-child td {
      border-bottom: none;
    }

    .mini-post-table tr:hover td {
      background-color: #f0f0f0;
    }

    .mini-post-img {
      display: block;
      width: 100%;
      max-width: 110px;
      border: 1px solid #aaaaaa;
      margin-bottom: 5px;
      object-fit: cover;
    }

    .mini-post-title {
      font-family: "Times New Roman", Times, serif;
      font-size: 13px;
      font-weight: bold;
      color: #000088;
      margin: 0 0 3px 0;
    }

    .mini-post-body {
      font-family: "Times New Roman", Times, serif;
      font-size: 11px;
      color: #444444;
      line-height: 1.5;
      margin: 0;
    }

    /* ---- POST INDEX TABLE ---- */
    #post-index {
      width: 100%;
      border-collapse: collapse;
      border: 4px solid #777777;
      background-color: #ffffff;
      color: #111111;
    }

    #post-index td {
      padding: 10px 12px;
      border-bottom: 1px solid #bbbbbb;
      vertical-align: middle;
    }

    #post-index tr:last-child td {
      border-bottom: none;
    }

    #post-index tr:hover td {
      background-color: #f0f0f0;
    }

    .index-thumb {
      width: 80px;
      text-align: center;
      white-space: nowrap;
    }

    .index-thumb img {
      width: 72px;
      height: 54px;
      border: 1px solid #aaaaaa;
      display: block;
      margin: 0 auto;
      object-fit: cover;
    }

    .index-thumb .thumb-placeholder {
      width: 72px;
      height: 54px;
      background-color: #cccccc;
      border: 1px solid #aaaaaa;
      display: block;
      margin: 0 auto;
      font-size: 9px;
      color: #888888;
      text-align: center;
      line-height: 54px;
      font-family: "Times New Roman", Times, serif;
    }

    .index-info {
      padding-left: 6px;
    }

    .index-info a {
      font-family: "Times New Roman", Times, serif;
      font-size: 15px;
      font-weight: bold;
      color: #000088;
      text-decoration: underline;
    }

    .index-info a:visited {
      color: #440088;
    }

    .index-info a:hover {
      background-color: #ffffcc;
      color: #000000;
    }

    .index-desc {
      font-family: "Times New Roman", Times, serif;
      font-size: 13px;
      color: #444444;
      margin-top: 3px;
    }

  </style>
</head>
<body>

<!-- POST REGISTRY lives in posts.js — edit that file to add new posts -->
<script type="text/javascript" src="posts.js"></script>

<!-- ==================== OUTER LAYOUT ==================== -->
<div id="outer">
  <table width="100%" cellpadding="0" cellspacing="10" border="0">
    <tr valign="top">

      <!-- ====== LEFT COLUMN: title + nav ====== -->
      <td id="left-col">
        <h1>rhubarb dogma</h1>
        <div id="navbar">
          <a href="index.html">[ home ]</a>
          <a href="about.html">[ about ]</a>
          <a href="archives.html">[ archives ]</a>
          <a href="links.html">[ links ]</a>
        </div>
      </td>

      <!-- ====== MAIN CONTENT ====== -->
      <td id="main-content">

        <h2 class="section-header">&#187; recent entries</h2>

        <table id="post-index" cellpadding="10" cellspacing="0" border="1" bordercolor="#777777" align="center">
        </table>

        <script type="text/javascript">
          var table = document.getElementById("post-index");
          var limit = Math.min(POSTS.length, 10);
          for (var i = 0; i < limit; i++) {
            var p = POSTS[i];
            var thumb = p.image
              ? '<img src="' + p.image + '" alt="">'
              : '<span class="thumb-placeholder">no img</span>';
            var row = table.insertRow(-1);
            row.innerHTML =
              '<td class="index-thumb">' + thumb + '</td>' +
              '<td class="index-info">' +
                '<a href="' + p.link + '">' + p.title + '</a>' +
                '<div class="index-desc">' + p.desc + '</div>' +
              '</td>';
          }
          if (POSTS.length > 10) {
            var row = table.insertRow(-1);
            row.innerHTML =
              '<td colspan="2" style="text-align:center; padding:8px 0;">' +
                '<a href="archives.html">Previous Posts</a>' +
              '</td>';
          }
        </script>

      </td>

      <!-- ====== RIGHT SIDEBAR ====== -->
      <td id="right-col">

        <h2 class="section-header">&#187; notes</h2>

        <table class="mini-post-table" cellpadding="0" cellspacing="0" border="1" bordercolor="#777777">
          <tr>
            <td>
              <img class="mini-post-img" src="" alt="">
              <p class="mini-post-title">mini post title</p>
              <p class="mini-post-body">A short note or thought goes here. Keep it brief.</p>
            </td>
          </tr>
          <tr>
            <td>
              <p class="mini-post-title">mini post title</p>
              <p class="mini-post-body">A note without an image — just text is fine too.</p>
            </td>
          </tr>
          <tr>
            <td>
              <img class="mini-post-img" src="" alt="">
              <p class="mini-post-title">mini post title</p>
              <p class="mini-post-body">Another short note with an image above it.</p>
            </td>
          </tr>
        </table>

      </td>

    </tr>
  </table>


</div><!-- end #outer -->

</body>
</html>
